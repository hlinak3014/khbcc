<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>KHBCC 관리자</title>
<link rel="icon" href="../assets/khbcc-mark.png">
<style>
  #demo-bar{
    position:fixed;top:0;left:0;right:0;z-index:9999;height:40px;box-sizing:border-box;
    background:#0E1430;color:#fff;
    font:500 13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;
    border-bottom:2px solid #D81018;
  }
  #demo-bar b{background:#D81018;padding:3px 8px;border-radius:2px;font-size:11px;letter-spacing:.06em}
  #demo-bar span{opacity:.85}
  #demo-bar .who{margin-left:auto;opacity:.6;font-size:12px}
  body{margin:0}
  /* CMS 루트를 배너 아래로 밀어냄 */
  #nc-root{padding-top:40px;box-sizing:border-box;height:100vh}
  #nc-root > div{height:100%}
</style>
</head>
<body>

<div id="demo-bar">
  <b>미리보기</b>
  <span>화면 확인용입니다. 수정한 내용은 저장되지 않으며 실제 사이트에 반영되지 않습니다.</span>
  <span class="who">hlinak3014@gmail.com</span>
</div>

<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
// ---------------------------------------------------------------
//  미리보기 모드
//  실제 저장 기능을 켜려면 config.yml 을 쓰도록 아래 USE_REAL 을 true 로 바꾸고,
//  config.yml 의 backend 부분을 DecapBridge 값으로 채우면 됩니다.
// ---------------------------------------------------------------
var USE_REAL = false;

var COLLECTIONS = [{
  name: 'news',
  label: '활동 기록',
  files: [{
    name: 'items',
    label: '활동 기록 목록',
    file: 'news.json',
    description: '새 소식을 추가하거나 기존 내용을 고칩니다. 저장하면 1~2분 뒤 사이트에 반영됩니다.',
    fields: [{
      name: 'items', label: '소식', label_singular: '소식',
      widget: 'list', collapsed: true,
      summary: '{{fields.date}} · {{fields.ko.title}}',
      fields: [
        { name:'date', label:'날짜', widget:'datetime', date_format:'YYYY-MM-DD', time_format:false, format:'YYYY-MM-DD',
          hint:'이 날짜로 연도가 나뉘고 순서가 정해집니다.' },
        { name:'place', label:'장소', widget:'string', required:false, hint:'예 - 부다페스트 · BME (비워도 됩니다)' },
        { name:'image', label:'사진', widget:'image', required:false, allow_multiple:false,
          media_folder:'../assets/news', public_folder:'assets/news',
          hint:'사진을 끌어다 놓거나 눌러서 올리세요. 없으면 비워둡니다.' },
        { name:'link', label:'관련 링크', widget:'string', required:false,
          hint:'기사나 보도자료 주소가 있으면 넣으세요. https:// 로 시작해야 합니다.' },
        { name:'ko', label:'한국어', widget:'object', fields:[
            { name:'title', label:'제목', widget:'string' },
            { name:'body',  label:'내용', widget:'text' } ] },
        { name:'hu', label:'Magyar', widget:'object', fields:[
            { name:'title', label:'Cím', widget:'string' },
            { name:'body',  label:'Szöveg', widget:'text' } ] },
        { name:'en', label:'English', widget:'object', fields:[
            { name:'title', label:'Title', widget:'string' },
            { name:'body',  label:'Body', widget:'text' } ] }
      ]
    }]
  }]
}];

function boot(repoFiles){
  window.repoFiles = repoFiles || {};
  CMS.init({
    config: {
      backend: USE_REAL
        ? { name:'git-gateway', repo:'hlinak3014/khbcc', branch:'main' }
        : { name:'test-repo' },
      locale: 'ko',
      publish_mode: 'simple',
      media_folder: 'assets/news',
      public_folder: 'assets/news',
      load_config_file: false,
      collections: COLLECTIONS
    }
  });
}

// 실제 활동 기록을 불러와 미리보기에 채워 넣음
fetch('../news.json?v=' + Date.now())
  .then(function(r){ return r.ok ? r.text() : '{"items":[]}'; })
  .then(function(txt){ boot({ 'news.json': { content: txt } }); })
  .catch(function(){ boot({}); });
</script>
</body>
</html>
