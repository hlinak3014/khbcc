<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>KHBCC Admin</title>
<link rel="icon" href="../assets/khbcc-mark.png?v=2">
<style>
  #adm-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:99999;height:38px;box-sizing:border-box;
    background:#0E1430;color:#fff;
    font:500 12.5px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
    padding:0 14px;display:flex;gap:12px;align-items:center;
    border-top:2px solid #D81018;box-shadow:0 -2px 12px rgba(0,0,0,.18);
  }
  #adm-bar .tag{background:#D81018;padding:3px 8px;border-radius:2px;font-size:11px;letter-spacing:.06em;flex-shrink:0}
  #adm-bar .msg{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #adm-bar .who{opacity:.55;font-size:12px;margin-left:auto;flex-shrink:0;white-space:nowrap}
  #adm-lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:3px;overflow:hidden;flex-shrink:0}
  #adm-lang button{
    font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.07em;
    background:transparent;border:0;border-right:1px solid rgba(255,255,255,.3);
    color:#fff;padding:6px 9px;cursor:pointer;
  }
  #adm-lang button:last-child{border-right:0}
  #adm-lang button[aria-pressed="true"]{background:#fff;color:#0E1430}
  html,body{margin:0}
  /* CMS 가 아래 띠에 가리지 않도록 화면 높이를 줄임 */
  #nc-root{height:calc(100vh - 38px);overflow:hidden}
  @media (max-width:700px){ #adm-bar .msg{display:none} }
</style>
</head>
<body>

<div id="adm-bar">
  <span class="tag" id="adm-tag">PREVIEW</span>
  <span class="msg" id="adm-msg"></span>
  <span class="who">hlinak3014@gmail.com</span>
  <div id="adm-lang" role="group" aria-label="Interface language">
    <button data-l="ko" aria-pressed="false">KO</button>
    <button data-l="hu" aria-pressed="false">HU</button>
    <button data-l="en" aria-pressed="true">EN</button>
  </div>
</div>

<script>window.CMS_MANUAL_INIT = true;</script>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
// ---------------------------------------------------------------
//  KHBCC 관리자 화면
//
//  현재 미리보기 모드입니다. 수정 내용이 저장되지 않습니다.
//  실제 저장을 켜려면 아래 USE_REAL 을 true 로 바꾸고
//  config.yml 의 backend 부분을 DecapBridge 값으로 채우세요.
// ---------------------------------------------------------------
var USE_REAL = false;

// 화면 기본 언어. 저장된 선택이 있으면 그것을 먼저 씁니다.
var DEFAULT_UI_LANG = 'en';

var BANNER = {
  ko: { tag:'미리보기', msg:'화면 확인용입니다. 수정한 내용은 저장되지 않으며 실제 사이트에 반영되지 않습니다.' },
  hu: { tag:'ELŐNÉZET', msg:'Csak bemutató célra. A módosítások nem kerülnek mentésre, és nem jelennek meg az éles oldalon.' },
  en: { tag:'PREVIEW', msg:'Demonstration only. Changes are not saved and will not appear on the live site.' }
};

// 입력 칸 이름 (화면 언어에 따라 함께 바뀜)
var L = {
  ko: { coll:'활동 기록', file:'활동 기록 목록',
        desc:'새 소식을 추가하거나 기존 내용을 고칩니다. 저장하면 1~2분 뒤 사이트에 반영됩니다.',
        item:'소식', date:'날짜', dateHint:'이 날짜로 연도가 나뉘고 순서가 정해집니다.',
        place:'장소', placeHint:'예 - 부다페스트 · BME (비워도 됩니다)',
        image:'사진', imageHint:'사진을 끌어다 놓거나 눌러서 올리세요. 없으면 비워둡니다.',
        link:'관련 링크', linkHint:'기사나 보도자료 주소가 있으면 넣으세요. https:// 로 시작해야 합니다.',
        gKo:'한국어', gHu:'헝가리어', gEn:'영어', title:'제목', body:'내용',
        pages:'사이트 문구', pagesDesc:'각 페이지의 본문입니다. 한 문구를 고칠 때 세 언어를 함께 확인하세요.', line:'문구', key:'식별자 (수정 금지)' },
  hu: { coll:'Tevékenységek', file:'Tevékenységek listája',
        desc:'Új bejegyzés hozzáadása vagy meglévő szerkesztése. Mentés után 1–2 perccel jelenik meg az oldalon.',
        item:'Bejegyzés', date:'Dátum', dateHint:'Ez határozza meg az évet és a sorrendet.',
        place:'Helyszín', placeHint:'Pl. Budapest · BME (üresen hagyható)',
        image:'Fénykép', imageHint:'Húzza ide a képet, vagy kattintson a feltöltéshez. Üresen is hagyható.',
        link:'Hivatkozás', linkHint:'Ha van cikk vagy sajtóközlemény, adja meg. https:// kezdettel.',
        gKo:'Koreai', gHu:'Magyar', gEn:'Angol', title:'Cím', body:'Szöveg',
        pages:'Oldalszövegek', pagesDesc:'Az egyes oldalak szövegei. Egy szöveg módosításakor mindhárom nyelvet ellenőrizze.', line:'Szöveg', key:'Azonosító (ne módosítsa)' },
  en: { coll:'Activities', file:'Activity list',
        desc:'Add a new entry or edit an existing one. Changes appear on the site 1–2 minutes after saving.',
        item:'Entry', date:'Date', dateHint:'This determines the year grouping and the order.',
        place:'Place', placeHint:'e.g. Budapest · BME (may be left blank)',
        image:'Photo', imageHint:'Drag a photo here or click to upload. May be left blank.',
        link:'Link', linkHint:'Add a news article or press release URL if there is one. Must start with https://.',
        gKo:'Korean', gHu:'Hungarian', gEn:'English', title:'Title', body:'Body',
        pages:'Site text', pagesDesc:'The text of each page. When you edit a line, check all three languages together.', line:'Line', key:'Key (do not edit)' }
};


var CONTENT_FILES = [
  ['common',  {ko:'공통 (메뉴·하단)', hu:'Közös (menü, lábléc)', en:'Common (menu, footer)'}],
  ['index',   {ko:'메인 페이지',       hu:'Főoldal',              en:'Home page'}],
  ['research',{ko:'연구 내용',         hu:'Kutatás',              en:'Research'}],
  ['people',  {ko:'연구진',            hu:'Kutatócsoport',        en:'Research team'}],
  ['news',    {ko:'활동 기록',         hu:'Tevékenységek',        en:'Activities'}],
  ['apply',   {ko:'기업 등록',         hu:'Cégregisztráció',      en:'Firm registration'}],
  ['reports', {ko:'보고서',            hu:'Jelentések',           en:'Reports'}]
];
function buildPageCollection(t, lang){
  return {
    name:'pages', label:t.pages, description:t.pagesDesc,
    editor:{ preview:false },
    files: CONTENT_FILES.map(function(f){
      return {
        name:f[0], label:f[1][lang], file:'content/'+f[0]+'.json',
        fields:[
          { name:'title', label:t.title, widget:'hidden' },
          { name:'items', label:t.line, label_singular:t.line, widget:'list', collapsed:true,
            summary:'{{fields.' + lang + '}}',
            fields:[
              { name:'key', label:t.key, widget:'hidden' },
              { name:'ko', label:t.gKo, widget:'text', required:false },
              { name:'hu', label:t.gHu, widget:'text', required:false },
              { name:'en', label:t.gEn, widget:'text', required:false }
            ] }
        ]
      };
    })
  };
}

function buildCollections(t, lang){
  return [{
    name:'news', label:t.coll,
    files:[{
      name:'items', label:t.file, file:'news.json', description:t.desc,
      fields:[{
        name:'items', label:t.item, label_singular:t.item,
        widget:'list', collapsed:true,
        summary:'{{fields.date}} · {{fields.' + lang + '.title}}',
        fields:[
          { name:'date', label:t.date, widget:'datetime',
            date_format:'YYYY-MM-DD', time_format:false, format:'YYYY-MM-DD', hint:t.dateHint },
          { name:'place', label:t.place, widget:'string', required:false, hint:t.placeHint },
          { name:'image', label:t.image, widget:'image', required:false, allow_multiple:false,
            media_folder:'../assets/news', public_folder:'assets/news', hint:t.imageHint },
          { name:'link', label:t.link, widget:'string', required:false, hint:t.linkHint },
          { name:'ko', label:t.gKo, widget:'object', fields:[
              { name:'title', label:t.title, widget:'string' },
              { name:'body',  label:t.body,  widget:'text' } ] },
          { name:'hu', label:t.gHu, widget:'object', fields:[
              { name:'title', label:t.title, widget:'string' },
              { name:'body',  label:t.body,  widget:'text' } ] },
          { name:'en', label:t.gEn, widget:'object', fields:[
              { name:'title', label:t.title, widget:'string' },
              { name:'body',  label:t.body,  widget:'text' } ] }
        ]
      }]
    }]
  }];
}

function currentLang(){
  var v = null;
  try { v = localStorage.getItem('khbcc-admin-lang'); } catch(e){}
  return (v && L[v]) ? v : DEFAULT_UI_LANG;
}

function paintBanner(lang){
  var b = BANNER[lang] || BANNER.en;
  document.getElementById('adm-tag').textContent = b.tag;
  document.getElementById('adm-msg').textContent = USE_REAL ? '' : b.msg;
  document.documentElement.lang = lang;
  var btns = document.querySelectorAll('#adm-lang button');
  for (var i=0;i<btns.length;i++){
    btns[i].setAttribute('aria-pressed', String(btns[i].dataset.l === lang));
  }
}

// 언어 전환은 CMS 전체를 다시 띄워야 하므로 새로고침합니다
document.querySelectorAll('#adm-lang button').forEach(function(btn){
  btn.addEventListener('click', function(){
    try { localStorage.setItem('khbcc-admin-lang', btn.dataset.l); } catch(e){}
    location.reload();
  });
});

function boot(repoFiles){
  var lang = currentLang();
  paintBanner(lang);
  window.repoFiles = repoFiles || {};
  CMS.init({
    config: {
      backend: USE_REAL
        ? { name:'git-gateway', repo:'hlinak3014/khbcc', branch:'main' }
        : { name:'test-repo' },
      locale: lang,
      publish_mode: 'simple',
      media_folder: 'assets/news',
      public_folder: 'assets/news',
      load_config_file: false,
      collections: [buildPageCollection(L[lang], lang)].concat(buildCollections(L[lang], lang))
    }
  });
}

(function(){
  var names = CONTENT_FILES.map(function(f){ return f[0]; });
  function get(u){ return fetch(u + '?v=' + Date.now()).then(function(r){ return r.ok ? r.text() : null; }).catch(function(){ return null; }); }
  Promise.all([get('../news.json')].concat(names.map(function(n){ return get('../content/' + n + '.json'); })))
    .then(function(res){
      var files = { 'news.json': { content: res[0] || '{"items":[]}' }, 'content': {} };
      names.forEach(function(n, i){ if (res[i+1]) files.content[n + '.json'] = { content: res[i+1] }; });
      boot(files);
    })
    .catch(function(){ boot({}); });
})();
</script>
</body>
</html>
